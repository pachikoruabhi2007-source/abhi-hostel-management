<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | HostelHub Resident Portal</title>
    
    <!-- Modern Typography: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --slate-900: #0F172A;
            --slate-800: #1E293B;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748B;
            --slate-400: #94A3B8;
            --slate-200: #E2E8F0;
            --slate-100: #F1F5F9;
            --slate-50: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(226, 232, 240, 0.85);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow-xl: 0 24px 50px -12px rgba(15, 23, 42, 0.12), 0 8px 24px -4px rgba(79, 70, 229, 0.08);
            --shadow-btn: 0 10px 22px -6px rgba(79, 70, 229, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F8FAFC;
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Animated Mesh Background */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.65;
            animation: floatBlob 16s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -120px;
            left: -80px;
            width: 440px;
            height: 440px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.28), rgba(99, 102, 241, 0.12));
        }

        .blob-2 {
            bottom: -150px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(79, 70, 229, 0.15));
            animation-duration: 20s;
        }

        .blob-3 {
            top: 40%;
            right: 25%;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.08));
            animation-duration: 14s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.08); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        /* Top Minimalist Header */
        .top-navbar {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--slate-900);
        }

        .brand-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            box-shadow: 0 8px 18px -4px rgba(79, 70, 229, 0.38);
        }

        .brand-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--slate-900);
        }

        .brand-text span {
            color: var(--primary);
        }

        .nav-back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--slate-200);
            color: var(--slate-700);
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .nav-back-link:hover {
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.4);
            transform: translateX(-3px);
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        /* Center Layout Wrapper */
        .auth-container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 48px;
        }

        /* Glassmorphism Card */
        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 44px 38px;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card Top Decorative Bar */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 50%, #06B6D4 100%);
        }

        /* Icon Badge */
        .icon-badge-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-badge {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            border: 1px solid rgba(79, 70, 229, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
            position: relative;
            box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.25);
            transition: transform 0.4s ease;
        }

        .icon-badge:hover {
            transform: translateY(-3px) rotate(-6deg);
        }

        .icon-badge::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, transparent 70%);
            z-index: -1;
        }

        /* Typography */
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--slate-900);
            margin-bottom: 10px;
        }

        .auth-subtitle {
            font-size: 14.5px;
            line-height: 1.55;
            color: var(--slate-500);
            max-width: 360px;
            margin: 0 auto;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--slate-700);
            margin-bottom: 8px;
            letter-spacing: -0.1px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 16px;
            color: var(--slate-400);
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 46px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--slate-900);
            background: #ffffff;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow), 0 2px 6px rgba(79, 70, 229, 0.08);
            background: #ffffff;
        }

        .form-input:focus + .input-icon,
        .input-box:focus-within .input-icon {
            color: var(--primary);
        }

        .form-input::placeholder {
            color: var(--slate-400);
            font-weight: 400;
        }

        .input-hint {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            font-size: 12px;
            color: var(--slate-500);
            margin-top: 8px;
            line-height: 1.45;
        }

        .input-hint i {
            color: var(--primary);
            margin-top: 1.5px;
            font-size: 12px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -6px rgba(79, 70, 229, 0.55);
            background: linear-gradient(135deg, #4338CA 0%, #3730A3 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Micro-shine shimmer effect on button */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: 0.6s;
        }

        .btn-submit:hover::after {
            left: 150%;
        }

        /* Footer & Helpers */
        .auth-footer {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--slate-100);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .back-login-text {
            font-size: 14px;
            color: var(--slate-600);
        }

        .back-login-link {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-login-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 9999px;
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--slate-500);
        }

        .security-badge i {
            color: #10B981;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 540px) {
            .top-navbar {
                padding: 16px 20px;
            }
            .auth-card {
                padding: 32px 24px;
                border-radius: 20px;
            }
            .auth-title {
                font-size: 22px;
            }
            .icon-badge {
                width: 62px;
                height: 62px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Mesh Gradients -->
    <div class="ambient-mesh">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
    </div>

    <!-- Top Minimalist Navbar -->
    <header class="top-navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon-box">
                <i class="fa-solid fa-hotel"></i>
            </div>
            <div class="brand-text">Hostel<span>Hub</span></div>
        </a>

        <a href="/login" class="nav-back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Login</span>
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="auth-container">
        <div class="auth-card">
            
            <!-- Glowing Lock/Key Icon -->
            <div class="icon-badge-wrapper">
                <div class="icon-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>

            <!-- Title & Subtitle -->
            <div class="auth-header">
                <h1 class="auth-title">Reset Your Password</h1>
                <p class="auth-subtitle">
                    Enter the Gmail address associated with your hostel account to receive a secure 6-digit verification code.
                </p>
            </div>

            <!-- Form -->
            <form action="/forgot-password" method="POST" id="forgotForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="email" class="form-label">Registered Gmail Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="resident@gmail.com"
                            required
                            autocomplete="email"
                            autofocus
                        >
                    </div>
                    <div class="input-hint">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>A 6-digit one-time code valid for 5 minutes will be dispatched instantly.</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span id="btnText">Send Verification Code</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                </button>
            </form>

            <!-- Card Footer -->
            <footer class="auth-footer">
                <div class="back-login-text">
                    Remembered your password?
                    <a href="/login" class="back-login-link">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 12px;"></i>
                    </a>
                </div>

                <div class="security-badge">
                    <i class="fa-solid fa-lock"></i>
                    <span>256-Bit Encrypted Authentication</span>
                </div>
            </footer>

        </div>
    </main>

    <script>
        function handleSubmit(e) {
            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.8";
            btnText.textContent = "Dispatching OTP...";
            btnIcon.className = "fa-solid fa-spinner fa-spin";
        }
    </script>

</body>
</html>
