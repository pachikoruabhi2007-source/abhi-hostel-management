<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | HostelHub Resident Portal</title>
    
    <!-- Modern Typography: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --slate-900: #0F172A;
            --slate-800: #1E293B;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748B;
            --slate-400: #94A3B8;
            --slate-200: #E2E8F0;
            --slate-100: #F1F5F9;
            --slate-50: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(226, 232, 240, 0.85);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow-xl: 0 24px 50px -12px rgba(15, 23, 42, 0.12), 0 8px 24px -4px rgba(79, 70, 229, 0.08);
            --shadow-btn: 0 10px 22px -6px rgba(79, 70, 229, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F8FAFC;
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.65;
            animation: floatBlob 16s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -120px;
            left: -80px;
            width: 440px;
            height: 440px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.28), rgba(99, 102, 241, 0.12));
        }

        .blob-2 {
            bottom: -150px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(79, 70, 229, 0.15));
            animation-duration: 20s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.08); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        .top-navbar {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--slate-900);
        }

        .brand-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            box-shadow: 0 8px 18px -4px rgba(79, 70, 229, 0.38);
        }

        .brand-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--slate-900);
        }

        .brand-text span {
            color: var(--primary);
        }

        .nav-back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--slate-200);
            color: var(--slate-700);
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .nav-back-link:hover {
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.4);
            transform: translateX(-3px);
            background: #ffffff;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 48px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 44px 38px;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 50%, #06B6D4 100%);
        }

        .icon-badge-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-badge {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            border: 1px solid rgba(79, 70, 229, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
            box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.25);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--slate-900);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            line-height: 1.55;
            color: var(--slate-500);
            max-width: 360px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--slate-700);
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 16px;
            color: var(--slate-400);
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 46px 0 46px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--slate-900);
            background: #ffffff;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow), 0 2px 6px rgba(79, 70, 229, 0.08);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--slate-400);
            cursor: pointer;
            padding: 6px;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--slate-700);
        }

        .validation-hint {
            font-size: 12px;
            color: var(--slate-500);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-msg {
            color: #DC2626;
            font-size: 12.5px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -6px rgba(79, 70, 229, 0.55);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--slate-100);
            display: flex;
            justify-content: center;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 9999px;
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--slate-500);
        }

        .security-badge i {
            color: #10B981;
        }
    </style>
</head>

<body>

    <div class="ambient-mesh">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
    </div>

    <header class="top-navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon-box">
                <i class="fa-solid fa-hotel"></i>
            </div>
            <div class="brand-text">Hostel<span>Hub</span></div>
        </a>

        <a href="/login" class="nav-back-link" onclick="cancelPasswordReset(event)">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Cancel</span>
        </a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            
            <div class="icon-badge-wrapper">
                <div class="icon-badge">
                    <i class="fa-solid fa-lock-open"></i>
                </div>
            </div>

            <div class="auth-header">
                <h1 class="auth-title">Create New Password</h1>
                <p class="auth-subtitle">
                    Choose a strong password with at least 6 characters for your resident portal account.
                </p>
            </div>

            <form action="/reset-password" method="POST" id="resetForm" onsubmit="return validateForm()">
                
                <div class="form-group">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-key input-icon"></i>
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            class="form-input"
                            placeholder="Enter new password (min. 6 chars)"
                            required
                            minlength="6"
                            oninput="checkMatch()"
                        >
                        <button type="button" class="toggle-password" onclick="toggleVisibility('newPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="validation-hint">
                        <i class="fa-solid fa-shield" style="color: #4F46E5;"></i>
                        <span>Minimum 6 characters</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-check-double input-icon"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="form-input"
                            placeholder="Confirm your new password"
                            required
                            minlength="6"
                            oninput="checkMatch()"
                        >
                        <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-msg" id="passwordMatchError">
                        <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span id="btnText">Save New Password</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                </button>
            </form>

            <footer class="auth-footer">
                <div class="security-badge">
                    <i class="fa-solid fa-lock"></i>
                    <span>256-Bit Encrypted BCrypt Protection</span>
                </div>
            </footer>

        </div>
    </main>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function checkMatch() {
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const err = document.getElementById('passwordMatchError');
            const btn = document.getElementById('btnSubmit');

            if (p2.length > 0 && p1 !== p2) {
                err.style.display = 'block';
                btn.disabled = true;
            } else {
                err.style.display = 'none';
                btn.disabled = false;
            }
        }

        let isPasswordFormSubmitted = false;

        // SAFETY GUARD: Prevent BFCache from showing stale form on Back navigation
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // SAFETY GUARD: If user navigates Back or leaves reset-password without submitting,
        // immediately invalidate OTP and verification so they must start OTP generation again
        window.addEventListener('pagehide', function() {
            if (!isPasswordFormSubmitted) {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/api/reset-password/cancel');
                } else {
                    fetch('/api/reset-password/cancel', { method: 'POST', keepalive: true });
                }
            }
        });

        function cancelPasswordReset(e) {
            e.preventDefault();
            isPasswordFormSubmitted = true;
            fetch('/api/reset-password/cancel', { method: 'POST' })
                .finally(() => {
                    window.location.href = '/login';
                });
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                document.getElementById('passwordMatchError').style.display = 'block';
                return;
            }

            if (p1.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            isPasswordFormSubmitted = true;

            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            btnText.textContent = "Updating Password...";
            btnIcon.className = "fa-solid fa-spinner fa-spin";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.8";

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ newPassword: p1, confirmPassword: p2 })
                });

                const data = await response.json().catch(() => null);

                if (response.ok && (!data || data.success)) {
                    btnText.textContent = "Password Updated!";
                    btnIcon.className = "fa-solid fa-check";
                    btn.style.background = "#059669";
                    // Using location.replace removes reset-password from history so Back button doesn't loop
                    window.location.replace((data && data.redirectUrl) || '/login?reset=success');
                } else {
                    isPasswordFormSubmitted = false;
                    btn.style.pointerEvents = "auto";
                    btn.style.opacity = "1";
                    btnText.textContent = "Save New Password";
                    btnIcon.className = "fa-solid fa-arrow-right";
                    alert((data && data.message) || "Failed to update password. Please try again.");
                }
            } catch (err) {
                // If fetch network error, fallback to traditional submit
                this.submit();
            }
        });
    </script>

</body>
</html>
